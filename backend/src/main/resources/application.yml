spring:
  application:
    name: pms-hotel-backend
  config:
    # Dev local : réutilise le .env de docker-compose (ignoré s'il est absent : CI, conteneur)
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:pms_hotel}
    username: ${POSTGRES_USER:pms_user}
    password: ${POSTGRES_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Associations paresseuses chargées par lots (IN) plutôt qu'une requête par élément
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    web:
      pageable:
        # Taille de page demandée plafonnée (2000 par défaut)
        max-page-size: 100
  web:
    # API mono-langue (i18n hors MVP) : messages de validation en français quel que soit le client
    locale: fr
    locale-resolver: fixed
  mvc:
    format:
      # Dates des paramètres d'URL en ISO (2026-10-10), indépendamment de la locale
      date: iso

server:
  port: 8080

pms:
  jwt:
    # Pas de valeur par défaut : sans JWT_SECRET, l'application refuse de démarrer
    secret: ${JWT_SECRET}
    # Durée d'une vacation, sans refresh token (ADR-002)
    expiration: 8h
  # « Aujourd'hui » est la date de l'hôtel, pas celle du serveur (souvent en UTC)
  time-zone: Europe/Paris
