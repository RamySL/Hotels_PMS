# En-têtes de sécurité de l'application. Le jeton vit dans le localStorage (ADR 0008) :
# la politique de contenu n'autorise que les scripts du site lui-même, jamais un script
# en ligne ou venu d'ailleurs, ce qui ferme la porte aux scripts injectés (XSS).
# Inclus dans chaque location : un add_header local masque ceux du niveau au-dessus.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
