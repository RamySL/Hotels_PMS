# Le front et l'API sur une seule origine : nginx sert l'application, et relaie au backend
# l'API et sa documentation. Il n'y a donc aucune autorisation cross-origin (CORS) à ouvrir.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # L'API ; Spring Security pose ses propres en-têtes de sécurité
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI et la description OpenAPI, pages du backend : leurs scripts en ligne
    # n'auraient pas leur place sous la politique de sécurité de l'application
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers produits par Vite, dont le nom change avec le contenu : un an de cache
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Les routes de l'application (/reservations/…) retombent sur index.html, qui n'est
    # jamais gardé en cache : une nouvelle version s'affiche dès le rechargement
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
