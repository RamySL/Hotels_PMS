# Toute l'application : la base, le backend et le front (nginx).
#   cp .env.example .env && docker compose up --build   puis   http://localhost:3000
# En développement, « docker compose up -d postgres » ne lance que la base.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Pour le backend lancé hors conteneur en développement ; joignable de la machine seule
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      # Données de démonstration au premier démarrage, sur une base sans chambre
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "${FRONT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pms_postgres_data:
